<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主页内容管理 | Qingxu Huang</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="assets/editor.css"><script src="data/content.js" defer></script><script src="assets/schema.js" defer></script><script src="assets/engine.js" defer></script><script src="assets/package.js" defer></script><script src="assets/bundle.js" defer></script><script src="assets/editor.js" defer></script></head>
<body><header class="editor-header"><a href="index.html" class="editor-brand"><span>QH</span><div>主页内容管理<small>中文 / English</small></div></a><div class="editor-actions"><button id="undo" disabled>撤销操作</button><button id="preview">预览网站</button><button id="export" class="primary">导出网站 ZIP</button></div></header>
<div id="restore-banner" class="restore-banner" hidden><span id="restore-text">发现本机草稿。</span><button id="restore">恢复草稿</button><button id="ignore-draft">使用当前文件</button></div>
<div class="editor-shell"><aside class="editor-sidebar"><p class="side-label">内容栏目</p><nav id="section-nav" aria-label="内容栏目"></nav><div class="backup-tools"><p>备份与迁移</p><button id="backup">下载资料备份</button><label class="file-button" for="import-file">导入资料备份<input id="import-file" type="file" accept=".json,application/json"></label><p class="small">换电脑时导入 JSON 备份即可继续编辑。</p></div></aside>
<main class="editor-main"><div class="work-heading"><div><p class="kicker">你的资料，一处维护</p><h1 id="section-title">基本资料</h1></div><button id="add" class="primary" hidden>＋ 新增条目</button></div><p class="workflow-note">修改内容 → 预览 → 导出 ZIP → 解压后上传 GitHub。这里保存的是本机草稿，线上主页在上传后更新。</p><div id="status" role="status" aria-live="polite">资料已载入</div><div id="errors" class="errors" role="alert" hidden></div>
<div id="workspace"><section id="record-panel" aria-label="条目列表"><label for="search">查找条目</label><input id="search" type="search" placeholder="输入标题、作者或年份"><p id="record-count" class="small"></p><div id="record-list"></div></section><section id="form-panel" aria-label="内容编辑"><div id="record-toolbar"><span id="record-position"></span><div><button id="up" title="上移一位">上移</button><button id="down" title="下移一位">下移</button><button id="duplicate">复制</button><button id="remove" class="danger">移除</button></div></div><p id="section-help" class="form-help"></p><form id="content-form" autocomplete="off"></form><div id="empty-state" hidden><h2>还没有条目</h2><p>点击“新增条目”，填写中英文内容。</p></div></section></div></main></div>
<dialog id="preview-dialog"><div class="preview-bar"><strong>网站预览</strong><label>语言 <select id="preview-language"><option value="zh">中文</option><option value="en">English</option></select></label><label>页面 <select id="preview-page"><option value="index">个人简介</option><option value="research">研究项目</option><option value="publications">论文著作</option><option value="teaching">教学招生</option><option value="service">学术服务</option><option value="group">学生培养</option></select></label><button id="close-preview" aria-label="关闭预览">关闭</button></div><iframe id="preview-frame" title="主页实时预览" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe></dialog>
<noscript><p class="noscript">内容编辑需要浏览器开启 JavaScript。网站正文仍可直接打开阅读。</p></noscript></body></html>
